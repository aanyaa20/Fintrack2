services:
  - type: web
    name: fintrack-backend
    runtime: node
    env: node
    region: oregon # Choose closest region: oregon, frankfurt, singapore
    plan: free # Free tier
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /api
      # Add these in Render Dashboard (never commit secrets)
      # - MONGO_URI
      # - JWT_SECRET
      # - JWT_REFRESH_SECRET
      # - GEMINI_API_KEY
      # - CLOUDINARY_CLOUD_NAME
      # - CLOUDINARY_API_KEY
      # - CLOUDINARY_API_SECRET
      # - EMAIL_USER
      # - EMAIL_PASS
      # - FRONTEND_ORIGIN
      # - GITHUB_CLIENT_ID
      # - GITHUB_CLIENT_SECRET
      # - GITHUB_CALLBACK_URL
